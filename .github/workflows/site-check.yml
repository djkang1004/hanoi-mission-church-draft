name: Site check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 홈페이지 점검 (내부 링크 · 이미지 · 한/베 문구 · SEO)
        run: node scripts/check-site.mjs
